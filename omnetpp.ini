[General]
network = TorusNetwork
sim-time-limit = 20s
record-eventlog = false

*.rootRank = 0
*.startTime = 1s
*.payloadBytes = 1024
*.linkDelay = 1ms
*.linkDatarate = 10Mbps


[Config Naive4x4]
description = "Naive MPI_Gather on 4x4 2D Torus"
*.rows = 4
*.cols = 4
*.algorithm = "naive"


[Config Optimized4x4]
description = "Topology-aware MPI_Gather on 4x4 2D Torus"
*.rows = 4
*.cols = 4
*.algorithm = "optimized"


[Config Naive8x8]
description = "Naive MPI_Gather on 8x8 2D Torus"
*.rows = 8
*.cols = 8
*.algorithm = "naive"


[Config Optimized8x8]
description = "Topology-aware MPI_Gather on 8x8 2D Torus"
*.rows = 8
*.cols = 8
*.algorithm = "optimized"

[Config Naive16x16]
description = "Naive MPI_Gather on 16x16 2D Torus"
*.rows = 16
*.cols = 16
*.algorithm = "naive"


[Config Optimized16x16]
description = "Topology-aware MPI_Gather on 16x16 2D Torus"
*.rows = 16
*.cols = 16
*.algorithm = "optimized"